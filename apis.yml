name: Myxt
description: 'Myxt is a consumer music streaming platform operated by Paper Phones
  Inc., built around the tagline "Musicians. Fans. Nothing in between." Instead of
  forced monthly subscriptions, Myxt uses an "unlock" model that lets artists monetize
  audio, session files, project files, images, and videos directly, while fans support
  creators without a recurring commitment and can chat with the artist after each unlock.
  Native iOS and Android apps extend access beyond the web. Surfaced as a portfolio
  company of Accel and added to the API Evangelist network; during enrichment no public
  API, developer portal, or SDK surface was found.'
